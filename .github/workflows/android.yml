name: Android APK

# Builds a signed APK. Pushing a tag like v1.0.0 also publishes it on the Releases page.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_FILE: SugarSwapSaga
  SPLASH_BG: '#4a1a7a'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          npm install --no-audit --no-fund
      - name: Create Android project
        run: |
          bash tools/build-www.sh
          npx cap add android
          npx cap sync android
          bash tools/android-customize.sh "${GITHUB_REF_NAME}" "${GITHUB_RUN_NUMBER}" "$SPLASH_BG"
      - name: Build
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -q
      - name: Sign
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::Add the ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD secrets"; exit 1; fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KS_B64" | base64 -d > release.p12
          VER="${GITHUB_REF_NAME#v}"; [ "$GITHUB_REF_TYPE" = tag ] || VER="dev-${GITHUB_RUN_NUMBER}"
          echo "APK=${APP_FILE}-${VER}.apk" >> "$GITHUB_ENV"
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.p12 --ks-type PKCS12 --ks-pass env:KS_PASS --ks-key-alias release --out "${APP_FILE}-${VER}.apk" aligned.apk
          "$BT/apksigner" verify "${APP_FILE}-${VER}.apk"
          rm release.p12
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}
      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$APK" --title "$APP_FILE $GITHUB_REF_NAME" --notes-file .github/release-notes.md
